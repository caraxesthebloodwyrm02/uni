name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint check
        run: uv run ruff check --fix

      - name: Verify lint applied no changes
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install -e .

      - name: Run tests
        run: uv run pytest

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: coverage-reports
          path: .coverage.*

  dependency-gate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check for dependency changes
        id: deps
        run: |
          if git diff --name-only origin/"${{ github.base_ref }}" HEAD | grep -E -q "pyproject\.toml|uv\.lock"; then
            echo "dependency_change=true" >> $GITHUB_OUTPUT
          else
            echo "dependency_change=false" >> $GITHUB_OUTPUT
          fi

      - name: Dependency hygiene check
        if: steps.deps.outputs.dependency_change == 'true'
        run: uv run pytest tests/test_dependency_hygiene.py

      - name: Generate dependency metrics
        if: steps.deps.outputs.dependency_change == 'true'
        run: |
          cat > .dependency-metrics.json <<EOF
          {
            "timestamp": "$(date -Iseconds)",
            "dependency_change": true,
            "branch": "${{ github.head_ref }}",
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Upload dependency metrics
        if: steps.deps.outputs.dependency_change == 'true'
        uses: actions/upload-artifact@v4.4.0
        with:
          name: dependency-metrics
          path: .dependency-metrics.json
