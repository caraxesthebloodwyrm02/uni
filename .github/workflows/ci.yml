name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Security lint check
        run: uv run ruff check --select S

      - name: Check for secrets in code files
        run: |
          if find . -type f \( -name "*.py" -o -name "*.toml" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) ! -path "*/.git/*" ! -path "*/.venv/*" ! -path "*/htmlcov/*" ! -path "*/.pytest_cache/*" ! -path "*/.github/*" -exec grep -i -l "password\|secret\|api_key\|token\|credential" {} \; 2>/dev/null; then
            echo "Potential secrets found in code files - review required"
            exit 0
          fi

      - name: Check for forbidden domains
        run: |
          # Exclude phase_handlers.py which contains governance documentation (legitimate references)
          if find . -type f \( -name "*.py" -o -name "*.toml" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) ! -path "*/.git/*" ! -path "*/.venv/*" ! -path "*/htmlcov/*" ! -path "*/.pytest_cache/*" ! -path "*/.github/*" ! -path "*/mangrove_platform/apparat/phase_handlers.py" -exec grep -l -E "factory\.ai|cursor\.com|cursor\.sh|workos\.com" {} \; 2>/dev/null; then
            echo "Forbidden domains detected in code files (3PAA-SHADOW containment)"
            exit 1
          fi

      - name: Check for forbidden tokens
        run: |
          # Exclude phase_handlers.py which contains governance documentation (legitimate references)
          if find . -type f \( -name "*.py" -o -name "*.toml" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) ! -path "*/.git/*" ! -path "*/.venv/*" ! -path "*/htmlcov/*" ! -path "*/.pytest_cache/*" ! -path "*/.github/*" ! -path "*/mangrove_platform/apparat/phase_handlers.py" -exec grep -l -E "WorkOS|Factory" {} \; 2>/dev/null; then
            echo "Forbidden tokens detected in code files (3PAA-SHADOW containment)"
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint check
        run: uv run ruff check --fix

      - name: Verify lint applied no changes
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install -e .

      - name: Run tests
        run: uv run pytest

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

  dependency-gate:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check for dependency changes
        id: deps
        run: |
          if git diff --name-only origin/"${{ github.base_ref }}" HEAD | grep -E -q "pyproject\.toml|uv\.lock"; then
            echo "dependency_change=true" >> $GITHUB_OUTPUT
          else
            echo "dependency_change=false" >> $GITHUB_OUTPUT
          fi

      - name: Dependency hygiene check
        if: steps.deps.outputs.dependency_change == 'true'
        run: uv run pytest tests/test_dependency_hygiene.py

      - name: Generate dependency metrics
        if: steps.deps.outputs.dependency_change == 'true'
        run: |
          cat > .dependency-metrics.json <<EOF
          {
            "timestamp": "$(date -Iseconds)",
            "dependency_change": true,
            "branch": "${{ github.head_ref }}",
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Upload dependency metrics
        if: steps.deps.outputs.dependency_change == 'true'
        uses: actions/upload-artifact@v4.4.0
        with:
          name: dependency-metrics
          path: .dependency-metrics.json
