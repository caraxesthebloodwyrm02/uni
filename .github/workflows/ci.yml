name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint check
        run: uv run ruff check --fix

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install -e .

      - name: Run tests
        run: uv run pytest

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: .coverage.*

  dependency-gate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check for dependency changes
        id: deps
        run: |
          if git diff --name-only origin/master HEAD | grep -q "pyproject.toml\|uv.lock"; then
            echo "dependency_change=true" >> $GITHUB_OUTPUT
          else
            echo "dependency_change=false" >> $GITHUB_OUTPUT
          fi

      - name: Dependency hygiene check
        if: steps.deps.outputs.dependency_change == 'true'
        run: uv run pytest tests/test_dependency_hygiene.py

      - name: Upload dependency metrics
        if: steps.deps.outputs.dependency_change == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-metrics
          path: .dependency-metrics.json
