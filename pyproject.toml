[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangrove"
version = "0.2.0"
description = "Multi-area Python workspace for the Mangrove ecosystem"
readme = "CLAUDE.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Irfan Kabir" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0,<8",
    "pytest>=8.3.0,<9",
    "ruff>=0.4.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["mangrove_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["mangrove_platform"]
addopts = ["--strict-markers", "-p", "no:anyio", "-p", "no:cacheprovider", "--cov=mangrove_platform", "--cov-report=term", "--cov-report=html", "--cov-report=xml"]

[tool.coverage.run]
source = ["mangrove_platform"]
data_file = ".coverage"
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/src/golding/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
exclude = "tests/apparat/test_validate_acceleration.py"

[[tool.mypy.overrides]]
module = "golding.*"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S110"]  # Allow assert and try-except-pass in tests
"mangrove_platform/mcp/test_server.py" = ["S101"]  # Allow assert in test scripts
"scripts/**/*.py" = ["S603", "S607"]  # Allow subprocess calls in scripts
"mangrove_platform/apparat/review_pack.py" = ["S603"]  # Subprocess for review pack generation
"mangrove_platform/apparat/horizontal_texture_processor.py" = ["S110"]  # Legitimate exception handling
"mangrove_platform/mcp/constraints_engine.py" = ["S110"]  # Legitimate exception handling
"tests/test_dependency_hygiene.py" = ["S603", "S607"]  # Test file with subprocess calls

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

