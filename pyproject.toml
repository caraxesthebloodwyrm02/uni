[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangrove"
version = "0.1.0"
description = "Multi-area Python workspace for the Mangrove ecosystem"
readme = "CLAUDE.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Irfan Kabir" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.4.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-p", "no:anyio"]

[tool.coverage.run]
source = ["platform"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/src/golding/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
