# Pre-commit configuration for Mangrove repository
# https://pre-commit.com for more information

repos:
  # General pre-commit hooks
  - repo: local
    hooks:
      - id: validate-workspace
        name: Validate workspace (3PAA-SHADOW, secrets, size)
        entry: uv run python scripts/validate_workspace.py
        language: system
        pass_filenames: false

      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: Fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: Check YAML syntax
        entry: yamllint
        language: system
        types: [yaml]

      - id: check-toml
        name: Check TOML syntax
        entry: check-json
        language: system
        types: [toml]

  # Python-specific hooks
  - repo: local
    hooks:
      - id: ruff-lint
        name: Run ruff linting
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: Run ruff formatting
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true





# Global settings
default_language_version:
  python: python3.13

# Global excludes
exclude: |
  (?x)^(
      \.venv/
    | \.git/
    | \.mypy_cache/
    | \.pytest_cache/
    | \.ruff_cache/
    | htmlcov/
    | coverage\.xml
    | \.coverage
    | .*\.egg-info/
    | build/
    | dist/
  )
